<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bolt-On Continuity Control Room</title><style>
:root{color-scheme:dark;--ink:#e8f0ea;--muted:#91a29a;--panel:#131b18;--line:#2b3933;--green:#7de2a5;--amber:#f1c75b;--blue:#78b7ff;--violet:#e4a8ff}*{box-sizing:border-box}body{margin:0;background:#09100d;color:var(--ink);font:15px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}main{max-width:1180px;margin:auto;padding:42px 24px 70px}header{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:24px}h1{font:600 clamp(32px,5vw,62px)/1.02 system-ui;margin:8px 0 14px;letter-spacing:-.04em}h2{font:600 24px system-ui}h3{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;margin:12px 0 8px}p{margin:0;overflow-wrap:anywhere}.eyebrow{color:var(--green);text-transform:uppercase;letter-spacing:.15em}.subject{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}article,.receipt,.error{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}.kind{display:inline-block;border:1px solid;padding:2px 7px;border-radius:999px;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.observed{color:var(--green)}.derived{color:var(--blue)}.retained{color:var(--amber)}.classification{color:var(--violet)}.operator-entered{color:#ffb68d}.unavailable{color:var(--muted)}.receipt{margin-top:24px}.receipt pre{white-space:pre-wrap;color:#bdc9c2;font-size:12px}.error{border-color:#754747;color:#ffb5b5}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}@media(max-width:600px){main{padding:24px 14px}article{min-width:0}}
</style></head><body><main><header><div class="eyebrow">Live read-only Docker evidence</div><h1>Bolt-On Continuity<br>Control Room</h1><p class="subject">One selected subject: <strong>$subject</strong></p><div class="legend"><span class="kind observed">observed</span><span class="kind derived">derived</span><span class="kind retained">retained</span><span class="kind unavailable">unavailable</span></div></header>$error<section class="grid">$cards</section><section class="receipt"><span class="kind retained">retained</span><h2>Deterministic receipt</h2><pre>$receipt</pre></section></main></body></html>
