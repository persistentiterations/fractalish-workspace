<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Living Pet</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12171fe8;
    --line: #2a3344;
    --ink: #e8e4da;
    --muted: #8a8690;
    --accent: #7eb8a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 16px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
  }
  .needs { display: flex; flex-direction: column; gap: 7px; }
  .need { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .need b { color: var(--ink); font-weight: 500; min-width: 54px; }
  .bar { width: 78px; height: 4px; background: #1c2430; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
  .bar.low i { background: #c47b6a; }
  .bar.mid i { background: #c4a574; }

  .status { text-align: right; font-size: 13px; max-width: 150px; line-height: 1.3; }
  .status span { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }

  .actions {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10;
  }
  .act {
    width: 52px; height: 52px; border-radius: 16px;
    border: 1px solid var(--line); background: var(--panel);
    font-size: 22px; cursor: pointer; display: grid; place-items: center;
    transition: transform 0.12s, border-color 0.2s;
  }
  .act:hover { border-color: var(--accent); }
  .act:active { transform: scale(0.9); }

  .toast {
    position: absolute; top: 92px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 20px; font-size: 12px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 20;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .hint {
    position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--muted); opacity: 0.7; pointer-events: none;
    transition: opacity 0.4s; z-index: 5;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="needs">
    <div class="need"><b>Energy</b><div class="bar" id="barE"><i></i></div></div>
    <div class="need"><b>Comfort</b><div class="bar" id="barC"><i></i></div></div>
    <div class="need"><b>Interest</b><div class="bar" id="barI"><i></i></div></div>
  </div>
  <div class="status">
    <div id="mood">watching</div>
    <span id="trust">trust: wary</span>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="hint" id="hint">pet it · drag the toy · feed when low</div>

<div class="actions">
  <button class="act" id="btnFeed" title="Feed">🍃</button>
  <button class="act" id="btnToy" title="Drop toy">🎾</button>
  <button class="act" id="btnRest" title="Lights">🌙</button>
  <button class="act" id="btnClean" title="Clean">💧</button>
</div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W, H, dpr;

  // ── Deterministic helpers ──
  // Same inputs always produce same steering decisions
  function prefer(a, b, bias) { return a * bias > b ? a : b; }

  const pet = {
    x: 0, y: 0, vx: 0, vy: 0, facing: 1,
    r: 30, squash: 1, stretch: 1, breath: 0,
    energy: 0.7, comfort: 0.75, interest: 0.55, trust: 0.3,
    hue: 165, glow: 0,
    eyeOpen: 1, blinkT: 2.5,
    lookX: 0, lookY: 0,
    // Face shape driven by state
    mouth: 0,   // -1 frown … 0 flat … 1 smile
    brow: 0,    // 0 relaxed … 1 raised
    // Short reaction
    react: null, reactT: 0,
    // Idle intention (deterministic)
    intent: "idle", intentT: 0,
    bits: []
  };

  const world = {
    light: 0.78,
    food: null,          // {x,y,life}
    toy: null,           // {x,y, vx, vy, held}
    dust: [],
    time: 0
  };

  const ptr = {
    x: 0, y: 0, down: false,
    mode: null,          // "pet" | "toy" | null
    lastX: 0, lastY: 0, stroke: 0
  };

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }

  function toast(m){
    const el = document.getElementById("toast");
    el.textContent = m;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 1500);
  }

  function setReact(name, t){ pet.react = name; pet.reactT = t; }

  function spawnBits(n, spd){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const s = spd*(0.5+Math.random()*0.6);
      pet.bits.push({
        x: pet.x, y: pet.y-6,
        vx: Math.cos(a)*s, vy: Math.sin(a)*s-18,
        life: 0.45+Math.random()*0.4, max: 0.45+Math.random()*0.4,
        r: 1.4+Math.random()*2, hue: pet.hue+(Math.random()-0.5)*35
      });
    }
  }

  // ── Face from stats (deterministic) ──
  function updateFace(){
    // Mouth: energy + comfort + trust
    const happy = pet.trust*0.5 + pet.comfort*0.3 + (pet.energy>0.5?0.2:0);
    const sad   = (1-pet.energy)*0.4 + (1-pet.comfort)*0.4;
    pet.mouth = clamp(happy - sad, -1, 1);
    if(pet.react==="happy") pet.mouth = 1;
    if(pet.react==="play")  pet.mouth = 0.8;
    if(pet.react==="sleepy") pet.mouth = -0.3;

    // Brow: interest / alertness
    pet.brow = clamp(pet.interest*0.7 + (pet.react==="play"?0.4:0), 0, 1);
  }

  // ── Idle behavior (deterministic rules) ──
  function chooseIntent(){
    // Priority order – always the same for same stats
    if(world.food && pet.energy < 0.85) return "food";
    if(world.toy && !world.toy.held && pet.interest > 0.35) return "toy";
    if(pet.energy < 0.22) return "rest";
    if(pet.interest < 0.3 && pet.energy > 0.4) return "wander";
    if(pet.comfort < 0.35) return "settle";
    return "idle";
  }

  function updateIntent(dt){
    pet.intentT -= dt;
    if(pet.intentT <= 0 || pet.react){
      pet.intent = chooseIntent();
      // Duration also deterministic-ish from stats
      pet.intentT = 1.2 + pet.energy*1.5 + pet.interest*0.8;
    }

    if(pet.react) return; // reaction overrides

    if(pet.intent === "food" && world.food){
      seek(world.food.x, world.food.y, 65);
      if(dist(pet.x,pet.y,world.food.x,world.food.y) < 16){
        // Eat
        world.food.life -= dt;
        pet.energy = clamp(pet.energy + dt*0.4, 0, 1);
        pet.comfort = clamp(pet.comfort + dt*0.12, 0, 1);
        pet.squash = lerp(pet.squash, 0.88, dt*6);
        if(world.food.life <= 0){
          world.food = null;
          pet.trust = clamp(pet.trust+0.07, 0, 1);
          setReact("happy", 1.3);
          spawnBits(7, 45);
          toast("ate");
        }
      }
    } else if(pet.intent === "toy" && world.toy && !world.toy.held){
      seek(world.toy.x, world.toy.y, 55);
      if(dist(pet.x,pet.y,world.toy.x,world.toy.y) < 22){
        // Nudge the toy
        world.toy.vx += (world.toy.x - pet.x) * 0.8;
        world.toy.vy += (world.toy.y - pet.y) * 0.8;
        pet.interest = clamp(pet.interest + dt*0.25, 0, 1);
        pet.energy   = clamp(pet.energy   - dt*0.04, 0, 1);
        if(Math.random() < 0.08) setReact("play", 0.9);
      }
    } else if(pet.intent === "rest"){
      pet.vx *= 0.92; pet.vy *= 0.92;
      pet.squash = lerp(pet.squash, 0.8, dt*3);
      pet.eyeOpen = lerp(pet.eyeOpen, 0.25, dt*3);
      pet.energy = clamp(pet.energy + dt*0.05, 0, 1);
    } else if(pet.intent === "wander"){
      // Slow deterministic wander using time + position hash
      const t = world.time * 0.35;
      const tx = Math.sin(t + pet.x*0.01) * 80;
      const ty = Math.cos(t*0.8 + pet.y*0.01) * 40;
      seek(tx, ty, 30);
    } else {
      // Idle – gently return toward center
      pet.vx += -pet.x * 0.5 * dt;
      pet.vy += -pet.y * 0.5 * dt;
    }
  }

  function seek(tx, ty, speed){
    const dx = tx - pet.x, dy = ty - pet.y;
    const d = Math.hypot(dx,dy) || 1;
    pet.vx = lerp(pet.vx, (dx/d)*speed, 0.12);
    pet.vy = lerp(pet.vy, (dy/d)*speed, 0.12);
    pet.facing = dx > 0 ? 1 : -1;
  }

  // ── Main update ──
  function update(dt){
    world.time += dt;
    pet.breath += dt * 1.35;
    pet.reactT -= dt;
    if(pet.reactT <= 0) pet.react = null;

    // Slow passive drift
    pet.energy   = clamp(pet.energy   - dt*0.0028, 0, 1);
    pet.comfort  = clamp(pet.comfort  - dt*0.0018, 0, 1);
    pet.interest = clamp(pet.interest - dt*0.0022, 0, 1);

    // Blink
    pet.blinkT -= dt;
    if(pet.blinkT <= 0){
      pet.eyeOpen = 0;
      if(pet.blinkT < -0.1){ pet.eyeOpen = 1; pet.blinkT = 2.6 + Math.random()*3; }
    }

    // Look toward pointer or toy
    let lx = 0, ly = 0;
    if(ptr.down){
      lx = clamp((ptr.x - W/2 - pet.x)*0.04, -4, 4);
      ly = clamp((ptr.y - H*0.52 - pet.y)*0.03, -3, 3);
    } else if(world.toy && !world.toy.held){
      lx = clamp((world.toy.x - pet.x)*0.03, -3.5, 3.5);
      ly = clamp((world.toy.y - pet.y)*0.025, -2.5, 2.5);
    }
    pet.lookX = lerp(pet.lookX, lx, dt*7);
    pet.lookY = lerp(pet.lookY, ly, dt*7);

    updateIntent(dt);
    updateFace();

    // Physics
    pet.x += pet.vx*dt; pet.y += pet.vy*dt;
    pet.vx *= 0.9; pet.vy *= 0.9;
    const bx = W*0.36, by = H*0.2;
    pet.x = clamp(pet.x, -bx, bx);
    pet.y = clamp(pet.y, -by, by);

    // Body feel
    let tSq = 1 + Math.sin(pet.breath)*0.03;
    let tSt = 1;
    if(pet.react==="happy"){ tSq = 0.87+Math.sin(world.time*13)*0.07; tSt = 1.07; }
    if(pet.react==="play"){  tSq = 0.84+Math.sin(world.time*15)*0.11; tSt = 1.1; }
    if(pet.intent==="rest" || pet.react==="sleepy") tSq = 0.78;
    pet.squash  = lerp(pet.squash, tSq, dt*7);
    pet.stretch = lerp(pet.stretch, tSt, dt*7);

    pet.hue  = lerp(pet.hue, 155 + pet.trust*30 + (pet.comfort-0.5)*15, dt*2);
    pet.glow = lerp(pet.glow, pet.trust*0.5 + (pet.react==="happy"?0.2:0), dt*3);

    // Toy physics
    if(world.toy && !world.toy.held){
      world.toy.x += world.toy.vx*dt;
      world.toy.y += world.toy.vy*dt;
      world.toy.vx *= 0.96; world.toy.vy *= 0.96;
      // Soft bounds
      if(Math.abs(world.toy.x) > bx) world.toy.vx *= -0.6;
      if(Math.abs(world.toy.y) > by) world.toy.vy *= -0.6;
      world.toy.x = clamp(world.toy.x, -bx, bx);
      world.toy.y = clamp(world.toy.y, -by, by);
    }

    // Food bob
    if(world.food) world.food.bob = Math.sin(world.time*3.5)*2.5;

    // Bits
    for(let i=pet.bits.length-1;i>=0;i--){
      const b = pet.bits[i];
      b.x += b.vx*dt; b.y += b.vy*dt; b.vy += 28*dt; b.life -= dt;
      if(b.life<=0) pet.bits.splice(i,1);
    }

    // Rare dust
    if(Math.random()<0.015){
      world.dust.push({ x:(Math.random()-0.5)*W*0.7, y:(Math.random()-0.5)*H*0.35, life:2+Math.random()*2, r:0.6+Math.random() });
    }
    for(let i=world.dust.length-1;i>=0;i--){
      world.dust[i].life -= dt;
      if(world.dust[i].life<=0) world.dust.splice(i,1);
    }

    updateUI();
  }

  function updateUI(){
    setBar("barE", pet.energy);
    setBar("barC", pet.comfort);
    setBar("barI", pet.interest);

    let m = "watching";
    if(pet.react==="happy") m = "happy";
    else if(pet.react==="play") m = "playing";
    else if(pet.intent==="food") m = "hungry";
    else if(pet.intent==="toy") m = "curious";
    else if(pet.intent==="rest") m = "sleepy";
    else if(pet.intent==="wander") m = "restless";
    else if(pet.energy<0.2) m = "tired";
    else if(pet.comfort<0.3) m = "uncomfortable";
    else if(pet.trust>0.7) m = "fond";
    document.getElementById("mood").textContent = m;

    const t = pet.trust;
    document.getElementById("trust").textContent =
      t>0.75 ? "trust: high" : t>0.5 ? "trust: medium" : t>0.25 ? "trust: low" : "trust: wary";
  }
  function setBar(id,v){
    document.querySelector("#"+id+" i").style.width = (v*100)+"%";
    const b = document.getElementById(id);
    b.classList.toggle("low", v<0.28);
    b.classList.toggle("mid", v>=0.28 && v<0.55);
  }

  // ── Draw ──
  function resize(){
    dpr = Math.min(devicePixelRatio||1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function draw(){
    const g = ctx.createRadialGradient(W/2,H*0.36,0,W/2,H*0.5,Math.max(W,H)*0.7);
    g.addColorStop(0, `hsl(210,15%,${9+world.light*5}%)`);
    g.addColorStop(1, `hsl(220,18%,${4+world.light*2}%)`);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    ctx.fillStyle = `hsla(200,8%,${13+world.light*6}%,0.35)`;
    ctx.beginPath(); ctx.ellipse(W/2,H*0.64,W*0.38,H*0.1,0,0,Math.PI*2); ctx.fill();

    ctx.save();
    ctx.translate(W/2, H*0.52);

    for(const d of world.dust){
      ctx.fillStyle = `hsla(40,8%,70%,${0.05*(d.life/3)})`;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill();
    }

    // Food
    if(world.food){
      const f = world.food, by = f.y+(f.bob||0);
      ctx.fillStyle = "hsla(95,55%,50%,0.9)";
      ctx.beginPath(); ctx.ellipse(f.x,by,10,7,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "hsla(95,40%,35%,0.4)";
      ctx.beginPath(); ctx.ellipse(f.x,by+5,8,3,0,0,Math.PI*2); ctx.fill();
    }

    // Toy
    if(world.toy){
      const t = world.toy;
      ctx.fillStyle = "hsla(10,70%,55%,0.95)";
      ctx.beginPath(); ctx.arc(t.x,t.y,9,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = "hsla(10,50%,30%,0.5)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(t.x,t.y,9,0,Math.PI*2); ctx.stroke();
      // highlight
      ctx.fillStyle = "hsla(40,80%,80%,0.35)";
      ctx.beginPath(); ctx.arc(t.x-3,t.y-3,3,0,Math.PI*2); ctx.fill();
    }

    for(const b of pet.bits){
      const a = b.life/b.max;
      ctx.fillStyle = `hsla(${b.hue},55%,65%,${a*0.55})`;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r*a,0,Math.PI*2); ctx.fill();
    }

    // Shadow
    ctx.fillStyle = `rgba(0,0,0,${0.18+(1-pet.squash)*0.08})`;
    ctx.beginPath();
    ctx.ellipse(pet.x, pet.y+pet.r*0.7, pet.r*0.9*pet.stretch, pet.r*0.25, 0,0,Math.PI*2);
    ctx.fill();

    drawPet();
    ctx.restore();

    const vig = ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.85);
    vig.addColorStop(0,"transparent");
    vig.addColorStop(1,`rgba(4,6,10,${0.48+(1-world.light)*0.15})`);
    ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);
  }

  function drawPet(){
    const R = pet.r;
    ctx.save();
    ctx.translate(pet.x, pet.y);
    ctx.scale(pet.stretch*pet.facing, pet.squash);

    if(pet.glow > 0.04){
      const gl = ctx.createRadialGradient(0,0,R*0.2,0,0,R*1.85);
      gl.addColorStop(0, `hsla(${pet.hue},50%,60%,${pet.glow*0.25})`);
      gl.addColorStop(1, "transparent");
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(0,0,R*1.85,0,Math.PI*2); ctx.fill();
    }

    const grad = ctx.createRadialGradient(-R*0.2,-R*0.25,0,0,0,R*1.05);
    grad.addColorStop(0, `hsla(${pet.hue},48%,${55+pet.energy*12}%,0.96)`);
    grad.addColorStop(0.7, `hsla(${pet.hue},42%,${35+pet.comfort*10}%,0.97)`);
    grad.addColorStop(1, `hsla(${pet.hue},38%,25%,0.98)`);
    ctx.fillStyle = grad;

    ctx.beginPath();
    const r = R;
    ctx.moveTo(0,-r*0.95);
    ctx.bezierCurveTo(r*0.7,-r*0.9, r*1.05,-r*0.25, r*0.95,r*0.2);
    ctx.bezierCurveTo(r*0.82,r*0.75, r*0.28,r*0.95, 0,r*0.9);
    ctx.bezierCurveTo(-r*0.28,r*0.95, -r*0.82,r*0.75, -r*0.95,r*0.2);
    ctx.bezierCurveTo(-r*1.05,-r*0.25, -r*0.7,-r*0.9, 0,-r*0.95);
    ctx.fill();

    // Eyes
    const eyeY = -r*0.12, spread = r*0.29, eR = r*0.13, open = pet.eyeOpen;
    for(const side of [-1,1]){
      ctx.save();
      ctx.translate(side*spread, eyeY);
      // brow
      if(pet.brow > 0.15){
        ctx.strokeStyle = `hsla(${pet.hue},30%,25%,${0.4+pet.brow*0.3})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-eR*0.9, -eR*1.1 - pet.brow*2);
        ctx.lineTo(eR*0.9, -eR*1.1 - pet.brow*3);
        ctx.stroke();
      }
      ctx.fillStyle = `hsla(40,25%,96%,${0.9*open})`;
      ctx.beginPath(); ctx.ellipse(0,0,eR*1.1,eR*open,0,0,Math.PI*2); ctx.fill();
      if(open > 0.25){
        ctx.fillStyle = "hsla(220,35%,14%,0.9)";
        ctx.beginPath();
        ctx.arc(pet.lookX*0.45, pet.lookY*0.45, eR*0.5, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Mouth from pet.mouth (-1..1)
    ctx.strokeStyle = `hsla(${pet.hue},30%,28%,0.55)`;
    ctx.lineWidth = 1.6; ctx.lineCap = "round";
    ctx.beginPath();
    const my = r*0.28;
    if(pet.mouth > 0.25){
      ctx.arc(0, my, r*0.13*pet.mouth+r*0.06, 0.2, Math.PI-0.2);
    } else if(pet.mouth < -0.25){
      ctx.arc(0, my+r*0.08, r*0.1*(-pet.mouth)+r*0.05, Math.PI+0.3, -0.3);
    } else {
      ctx.moveTo(-r*0.08, my); ctx.lineTo(r*0.08, my);
    }
    ctx.stroke();

    ctx.restore();
  }

  // ── Input ──
  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX-r.left, y: e.clientY-r.top };
  }
  function worldPos(p){
    return { x: p.x - W/2, y: p.y - H*0.52 };
  }

  canvas.addEventListener("pointerdown", e => {
    const p = pos(e);
    ptr.x = p.x; ptr.y = p.y; ptr.down = true;
    ptr.lastX = p.x; ptr.lastY = p.y; ptr.stroke = 0;
    canvas.setPointerCapture(e.pointerId);

    const wp = worldPos(p);

    // Pick up toy?
    if(world.toy && dist(wp.x,wp.y,world.toy.x,world.toy.y) < 18){
      ptr.mode = "toy";
      world.toy.held = true;
      world.toy.vx = 0; world.toy.vy = 0;
      return;
    }
    // Pet?
    if(dist(wp.x,wp.y,pet.x,pet.y) < pet.r*2.3){
      ptr.mode = "pet";
    } else {
      ptr.mode = null;
    }
  });

  canvas.addEventListener("pointermove", e => {
    const p = pos(e);
    ptr.x = p.x; ptr.y = p.y;
    const wp = worldPos(p);

    if(!ptr.down) return;

    if(ptr.mode === "toy" && world.toy){
      world.toy.x = wp.x;
      world.toy.y = wp.y;
    } else if(ptr.mode === "pet"){
      const d = Math.hypot(p.x-ptr.lastX, p.y-ptr.lastY);
      ptr.stroke += d;
      ptr.lastX = p.x; ptr.lastY = p.y;
      if(d > 1.5){
        pet.comfort  = clamp(pet.comfort  + 0.004, 0, 1);
        pet.trust    = clamp(pet.trust    + 0.002, 0, 1);
        pet.interest = clamp(pet.interest + 0.0015, 0, 1);
        if(Math.random() < 0.18) spawnBits(1, 22);
      }
      if(ptr.stroke > 65 && pet.react !== "happy"){
        setReact("happy", 1.5);
        spawnBits(9, 50);
        ptr.stroke = 0;
        toast(pet.trust > 0.5 ? "leans in" : "accepts touch");
        document.getElementById("hint").style.opacity = "0";
      }
    }
  });

  canvas.addEventListener("pointerup", e => {
    if(ptr.mode === "toy" && world.toy){
      // Fling based on last movement
      const p = pos(e);
      world.toy.vx = (p.x - ptr.lastX) * 3;
      world.toy.vy = (p.y - ptr.lastY) * 3;
      world.toy.held = false;
      pet.interest = clamp(pet.interest + 0.1, 0, 1);
    }
    ptr.down = false;
    ptr.mode = null;
  });

  // Buttons
  document.getElementById("btnFeed").onclick = () => {
    if(world.food){ toast("food already out"); return; }
    if(pet.energy > 0.9){ toast("not hungry"); return; }
    world.food = { x: pet.x + 40, y: pet.y + 45, life: 3 };
    toast("food placed");
  };

  document.getElementById("btnToy").onclick = () => {
    if(world.toy){ toast("toy already out"); return; }
    world.toy = { x: 60, y: -20, vx: 0, vy: 0, held: false };
    pet.interest = clamp(pet.interest + 0.15, 0, 1);
    toast("toy dropped – drag it");
  };

  document.getElementById("btnRest").onclick = () => {
    world.light = world.light > 0.5 ? 0.2 : 0.8;
    if(world.light < 0.4){
      setReact("sleepy", 3);
      pet.energy = clamp(pet.energy + 0.1, 0, 1);
      toast("lights dimmed");
    } else {
      pet.interest = clamp(pet.interest + 0.08, 0, 1);
      toast("lights up");
    }
  };

  document.getElementById("btnClean").onclick = () => {
    let did = false;
    if(world.food){ world.food = null; did = true; }
    if(world.toy && !world.toy.held){ world.toy = null; did = true; }
    world.dust = [];
    pet.comfort = clamp(pet.comfort + 0.18, 0, 1);
    toast(did ? "cleaned up" : "space cleared");
  };

  // Loop
  let last = 0;
  function loop(ts){
    if(!last) last = ts;
    const dt = Math.min(0.04, (ts-last)/1000);
    last = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  resize();
  updateUI();
  requestAnimationFrame(loop);
  setTimeout(() => toast("it notices the room"), 1600);
})();
</script>
</body>
</html>
