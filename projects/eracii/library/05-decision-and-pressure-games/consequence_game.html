<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The District · Consequence</title>
<style>
:root{--bg:#a8c7b0;--grass:#8fb29a;--water:#4a7a9f;--mud:#8b583f;--wood:#b8956e;--stone:#7a8a88;--ink:#2a211a;--accent:#d8ba69}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;z-index:10;pointer-events:none;padding:12px}
.info{position:absolute;top:0;left:0;background:rgba(34,29,24,.88);border:1px solid rgba(255,240,205,.22);border-radius:10px;padding:8px 10px;color:#f5f0df;font-size:11px;max-width:280px}
.info b{color:var(--accent);display:block;font-size:9px;text-transform:uppercase}
.items{position:absolute;top:0;right:0;background:rgba(34,29,24,.88);border:1px solid rgba(255,240,205,.22);border-radius:10px;padding:8px 10px;color:#f5f0df;font-size:10px;max-width:200px}
.items b{color:var(--accent);display:block;font-size:9px;text-transform:uppercase;margin-bottom:4px}
.item-line{margin:2px 0;color:#d5cdbb}
.hint{position:absolute;bottom:0;left:0;background:rgba(34,29,24,.88);border:1px solid rgba(255,240,205,.22);border-radius:10px;padding:8px 10px;color:#d5cdbb;font-size:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(34,29,24,.94);border:1px solid rgba(255,240,205,.22);border-radius:10px;padding:8px 12px;color:#f5f0df;font-size:11px;opacity:0;transition:.25s;max-width:500px;text-align:center}
.toast.show{opacity:1;bottom:32px}
.toast b{color:var(--accent)}
.interior{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:none}
.interior.active{display:flex;align-items:center;justify-content:center}
.interior-panel{background:rgba(34,29,24,.98);border:2px solid rgba(255,240,205,.3);border-radius:16px;padding:16px;color:#f5f0df;max-width:500px;text-align:center}
.interior-panel h2{color:var(--accent);margin:0 0 8px;font-size:16px}
.interior-panel p{font-size:12px;margin:6px 0;color:#d5cdbb}
.interior-panel button{background:rgba(216,186,105,.15);border:1px solid var(--accent);color:var(--accent);padding:6px 12px;border-radius:8px;margin-top:8px;cursor:pointer;font-weight:bold;font-size:11px}
.interior-panel button:hover{background:rgba(216,186,105,.25)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="info">
    <b>Objective</b>
    <span id="objective">Cross the river</span>
    <div id="status" style="margin-top:6px;color:#cbd5d5;font-size:9px"></div>
  </div>
  <div class="items">
    <b>Inventory</b>
    <div id="inventory"></div>
  </div>
  <div class="hint">
    <b>Move:</b> WASD/arrows · <b>Interact:</b> E/tap · <b>Exit:</b> Q/Esc
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="interior" id="interior">
  <div class="interior-panel" id="interiorPanel"></div>
</div>

<script>
// Canvas
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width = 1400;
const H = canvas.height = 900;

// Game state - CRITICAL: tracks all consequences
const gameState = {
  tick: 0,
  indoors: null,
  inventory: [],
  helped: new Set(), // tracks who player has helped
  worldChanges: {
    bridgeBoarded: false,
    ropeBridge: false,
    treeDeployed: false,
    gateOpen: false,
    waterDiverted: false,
    trainMoved: false
  },
  npcStates: {
    carpenter: { hasRope: false, helped: false },
    miller: { hasBoards: false, helped: false },
    gatekeeper: { canOpen: false, helped: false },
    engineer: { canMove: false, helped: false }
  }
};

// Player
const player = {
  x: 150,
  y: 750,
  radius: 8,
  speed: 3,
  width: 16,
  height: 20,
  direction: 'down'
};

const keys = {};
let cameraX = 0, cameraY = 0;

// --- WORLD GEOGRAPHY ---
// Left bank (start) and right bank (goal)
const riverStart = 600;
const riverEnd = 900;
const riverY = 400;
const riverHeight = 150;

// Buildings - LEFT BANK
const buildings = [
  { id: 'carpenter', x: 100, y: 150, w: 100, h: 80, type: 'workshop', name: 'Carpenter' },
  { id: 'mill', x: 300, y: 200, w: 140, h: 100, type: 'mill', name: 'Mill' },
  { id: 'storage', x: 1000, y: 150, w: 120, h: 90, type: 'storage', name: 'Storage' },
  { id: 'tower', x: 1200, y: 80, w: 100, h: 120, type: 'tower', name: 'Tower' },
  { id: 'gatehouse', x: 450, y: 700, w: 110, h: 90, type: 'gate', name: 'Gatehouse' }
];

// Fallen tree - initially blocks access, can be moved
const fallenTree = {
  x: 650,
  y: 550,
  w: 200,
  h: 30,
  deployed: false,
  name: 'Fallen Tree'
};

// Gate - initially closed
const gate = {
  x: 495,
  y: 700,
  w: 60,
  h: 90,
  open: false
};

// Train track visual (background element)
const trainTrack = { x: 950, y: 20, w: 300, h: 40 };

// NPCs with needs
const npcs = [
  { 
    id: 'carpenter', x: 150, y: 750, name: 'Carpenter', emoji: '🪵',
    need: 'I need rope to secure the bridge. Get it from the miller.',
    reward: 'boards',
    rewardMsg: 'Here are wooden boards for the bridge.'
  },
  {
    id: 'miller', x: 350, y: 350, name: 'Miller', emoji: '⚙️',
    need: 'The water wheel is stuck. Get oil from storage to fix it.',
    reward: 'rope',
    rewardMsg: 'The wheel turns! Here is rope from our stores.'
  },
  {
    id: 'gatekeeper', x: 500, y: 750, name: 'Gatekeeper', emoji: '⚔️',
    need: 'The south gate is jammed. Get tools from the carpenter.',
    reward: 'key',
    rewardMsg: 'The gate is open! Take this key.'
  },
  {
    id: 'engineer', x: 1250, y: 250, name: 'Engineer', emoji: '🔧',
    need: 'We need to move the train car blocking the right bank. Push it from the bridge.',
    reward: 'passage',
    rewardMsg: 'The tracks are clear! You can pass.'
  }
];

// Items that can be found/collected
const items = [
  { id: 'oil', x: 1050, y: 250, name: 'Oil Can', emoji: '🛢️', inBuilding: 'storage' },
  { id: 'tools', x: 180, y: 200, name: 'Tools', emoji: '🔨', inBuilding: 'carpenter' },
  { id: 'log', x: 750, y: 580, name: 'Tree Branch', emoji: '🪵', near: fallenTree }
];

// --- COLLISION ---
function isWalkable(x, y, radius = 8) {
  // Buildings
  for (const b of buildings) {
    if (x + radius > b.x && x - radius < b.x + b.w &&
        y + radius > b.y && y - radius < b.y + b.h) {
      return false;
    }
  }
  
  // River (water hazard)
  if (x > riverStart && x < riverEnd && y > riverY && y < riverY + riverHeight) {
    // Can cross if bridge is ready
    if (!isBridgeReady()) return false;
  }
  
  // Mud banks (slow zone)
  const mudZones = [
    { x: riverStart - 80, y: riverY + riverHeight - 50, w: 80, h: 80 },
    { x: riverEnd, y: riverY + riverHeight - 50, w: 80, h: 80 }
  ];
  for (const m of mudZones) {
    if (x > m.x && x < m.x + m.w && y > m.y && y < m.y + m.h) {
      // Mud is walkable but slow, we'll handle that in movement
    }
  }
  
  // Fallen tree (blocks path, unless deployed as bridge)
  if (!gameState.worldChanges.treeDeployed) {
    if (x + radius > fallenTree.x && x - radius < fallenTree.x + fallenTree.w &&
        y + radius > fallenTree.y && y - radius < fallenTree.y + fallenTree.h) {
      return false;
    }
  }
  
  // Gate (blocks passage)
  if (!gate.open) {
    if (x + radius > gate.x && x - radius < gate.x + gate.w &&
        y + radius > gate.y && y - radius < gate.y + gate.h) {
      return false;
    }
  }
  
  // Map bounds
  if (x < 10 || x > W - 10 || y < 10 || y > H - 10) return false;
  
  return true;
}

function isBridgeReady() {
  return gameState.worldChanges.bridgeBoarded || gameState.worldChanges.ropeBridge;
}

function getMovementSpeed() {
  // Check if in mud (slow down)
  const mudZones = [
    { x: riverStart - 80, y: riverY + riverHeight - 50, w: 80, h: 80 },
    { x: riverEnd, y: riverY + riverHeight - 50, w: 80, h: 80 }
  ];
  
  for (const m of mudZones) {
    if (player.x > m.x && player.x < m.x + m.w && player.y > m.y && player.y < m.y + m.h) {
      return player.speed * 0.4; // Deep mud is very slow
    }
  }
  return player.speed;
}

// --- GAME LOGIC ---
function movePlayer() {
  if (gameState.indoors) return;
  
  let dx = (keys['d'] || keys['right'] ? 1 : 0) - (keys['a'] || keys['left'] ? 1 : 0);
  let dy = (keys['s'] || keys['down'] ? 1 : 0) - (keys['w'] || keys['up'] ? 1 : 0);
  
  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    dx /= len;
    dy /= len;
    
    if (dy < 0) player.direction = 'up';
    else if (dy > 0) player.direction = 'down';
    else if (dx < 0) player.direction = 'left';
    else if (dx > 0) player.direction = 'right';
    
    const speed = getMovementSpeed();
    const newX = player.x + dx * speed;
    const newY = player.y + dy * speed;
    
    if (isWalkable(newX, newY)) {
      player.x = newX;
      player.y = newY;
    }
  }
}

function tryInteract() {
  if (gameState.indoors) {
    exitBuilding();
    return;
  }
  
  // Try to enter buildings
  for (const b of buildings) {
    if (Math.hypot(player.x - (b.x + b.w/2), player.y - (b.y + b.h/2)) < 60) {
      enterBuilding(b);
      return;
    }
  }
  
  // Try to interact with NPCs
  for (const npc of npcs) {
    if (Math.hypot(player.x - npc.x, player.y - npc.y) < 50) {
      showNpcDialog(npc);
      return;
    }
  }
  
  // Try to deploy fallen tree as bridge
  if (Math.hypot(player.x - (fallenTree.x + fallenTree.w/2), player.y - (fallenTree.y + fallenTree.h/2)) < 60) {
    if (!gameState.worldChanges.treeDeployed && hasItem('log')) {
      gameState.worldChanges.treeDeployed = true;
      removeItem('log');
      showToast('You positioned the tree as a bridge across the river!');
      updateStatus();
    } else if (gameState.worldChanges.treeDeployed) {
      showToast('The tree bridge is already in place.');
    } else {
      showToast('You need the tree branch to create a bridge.');
    }
    return;
  }
}

function enterBuilding(building) {
  gameState.indoors = building.id;
  showInterior(building);
}

function exitBuilding() {
  gameState.indoors = null;
  document.getElementById('interior').classList.remove('active');
}

function showInterior(building) {
  const panel = document.getElementById('interiorPanel');
  let content = `<h2>${building.name}</h2>`;
  
  if (building.type === 'workshop') {
    content += `<p>A carpenter's workshop filled with tools.</p>`;
    if (hasNpcHelped('carpenter')) {
      content += `<p style="color:var(--accent)">The carpenter has already given you boards.</p>`;
    } else {
      content += `<p style="color:#d8ba69">The carpenter looks at you expectantly.</p>`;
      content += `<button onclick="helpNpc('carpenter')">Help the Carpenter</button>`;
    }
  } else if (building.type === 'mill') {
    content += `<p>A water mill with a stuck wheel.</p>`;
    if (hasNpcHelped('miller')) {
      content += `<p style="color:var(--accent)">The wheel turns smoothly now.</p>`;
    } else {
      content += `<p style="color:#d8ba69">The miller gestures to the stuck mechanism.</p>`;
      content += `<button onclick="helpNpc('miller')">Help the Miller</button>`;
    }
  } else if (building.type === 'storage') {
    content += `<p>A storage building with supplies.</p>`;
    if (!hasItem('oil')) {
      content += `<p style="color:var(--accent)">You found an oil can!</p>`;
      content += `<button onclick="collectItem('oil','Oil Can')">Take Oil Can</button>`;
    } else {
      content += `<p>The shelves are empty now.</p>`;
    }
  } else if (building.type === 'tower') {
    content += `<p>A tall tower with a view of the land.</p>`;
    content += `<p>From here you can see the entire valley. The bridge across the river is your key passage.</p>`;
  } else if (building.type === 'gate') {
    content += `<p>A gatehouse controlling passage south.</p>`;
    if (!gate.open) {
      content += `<p style="color:#d8ba69">The gate is jammed shut.</p>`;
      content += `<button onclick="helpNpc('gatekeeper')">Help the Gatekeeper</button>`;
    } else {
      content += `<p style="color:var(--accent)">The gate is open.</p>`;
    }
  }
  
  content += `<button onclick="exitBuilding()">Exit</button>`;
  panel.innerHTML = content;
  document.getElementById('interior').classList.add('active');
}

function showNpcDialog(npc) {
  const panel = document.getElementById('interiorPanel');
  let content = `<h2>${npc.emoji} ${npc.name}</h2>`;
  
  if (hasNpcHelped(npc.id)) {
    content += `<p style="color:var(--accent)">Already helped this person.</p>`;
  } else {
    content += `<p>"${npc.need}"</p>`;
    content += `<button onclick="helpNpc('${npc.id}')">Help</button>`;
  }
  
  content += `<button onclick="exitDialog()">Close</button>`;
  panel.innerHTML = content;
  document.getElementById('interior').classList.add('active');
}

function exitDialog() {
  document.getElementById('interior').classList.remove('active');
}

function helpNpc(npcId) {
  const npc = npcs.find(n => n.id === npcId);
  const panel = document.getElementById('interiorPanel');
  
  // Check dependencies
  const needs = {
    carpenter: () => hasItem('rope'),
    miller: () => hasItem('oil'),
    gatekeeper: () => hasItem('tools'),
    engineer: () => true // can help anytime
  };
  
  if (needs[npcId]?.()) {
    gameState.helped.add(npcId);
    
    // Give reward
    giveReward(npcId, npc.reward);
    
    // Update world
    if (npcId === 'carpenter') {
      gameState.worldChanges.bridgeBoarded = true;
      showToast('The carpenter boards the bridge!');
    } else if (npcId === 'miller') {
      gameState.worldChanges.waterDiverted = true;
      showToast('The mill wheel turns! The rope is yours.');
      addItem('rope', 'Rope');
    } else if (npcId === 'gatekeeper') {
      gate.open = true;
      showToast('The gate is now open!');
    } else if (npcId === 'engineer') {
      gameState.worldChanges.trainMoved = true;
      showToast('The engineer moves the train car!');
    }
    
    panel.innerHTML = `<h2>${npc.emoji} ${npc.name}</h2><p style="color:var(--accent)">"${npc.rewardMsg}"</p><button onclick="exitDialog()">Continue</button>`;
    updateStatus();
  } else {
    let needsMsg = '';
    if (npcId === 'carpenter') needsMsg = 'You need rope for the carpenter.';
    else if (npcId === 'miller') needsMsg = 'You need oil for the miller.';
    else if (npcId === 'gatekeeper') needsMsg = 'You need tools for the gatekeeper.';
    
    panel.innerHTML = `<h2>${npc.name}</h2><p>${needsMsg}</p><button onclick="exitDialog()">Back</button>`;
  }
}

function giveReward(npcId, reward) {
  if (reward === 'rope') addItem('rope', 'Rope');
  else if (reward === 'boards') gameState.worldChanges.bridgeBoarded = true;
  else if (reward === 'key') addItem('key', 'Key');
  else if (reward === 'passage') gameState.worldChanges.trainMoved = true;
}

function collectItem(itemId, itemName) {
  addItem(itemId, itemName);
  document.getElementById('interior').classList.remove('active');
  exitBuilding();
  showToast(`You found: ${itemName}`);
}

function addItem(id, name) {
  if (!gameState.inventory.find(i => i.id === id)) {
    gameState.inventory.push({ id, name });
    updateInventory();
  }
}

function removeItem(id) {
  gameState.inventory = gameState.inventory.filter(i => i.id !== id);
  updateInventory();
}

function hasItem(id) {
  return gameState.inventory.some(i => i.id === id);
}

function hasNpcHelped(id) {
  return gameState.helped.has(id);
}

function updateInventory() {
  const inv = document.getElementById('inventory');
  if (gameState.inventory.length === 0) {
    inv.innerHTML = '<div class="item-line">Empty</div>';
  } else {
    inv.innerHTML = gameState.inventory.map(i => `<div class="item-line">• ${i.name}</div>`).join('');
  }
}

function updateStatus() {
  const status = document.getElementById('status');
  const ready = isBridgeReady();
  const helpedCount = gameState.helped.size;
  
  let msg = `NPCs helped: ${helpedCount}/4<br>Bridge: ${ready ? '✓ Ready' : '✗ Blocked'}`;
  status.innerHTML = msg;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// --- RENDERING ---
function drawBackground() {
  ctx.fillStyle = '#8fb29a';
  ctx.fillRect(0, 0, W, H);
  
  // Grass texture
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  for (let i = 0; i < 40; i++) {
    const x = (i % 8) * 175 + 20;
    const y = Math.floor(i / 8) * 180 + 40;
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawRiver() {
  // Water
  ctx.fillStyle = '#4a7a9f';
  ctx.fillRect(riverStart, riverY, riverEnd - riverStart, riverHeight);
  
  // Wave pattern
  ctx.strokeStyle = 'rgba(255,255,255,.15)';
  ctx.lineWidth = 1;
  for (let x = riverStart; x < riverEnd; x += 50) {
    ctx.beginPath();
    ctx.moveTo(x, riverY + 20);
    ctx.quadraticCurveTo(x + 15, riverY + 10, x + 30, riverY + 20);
    ctx.stroke();
  }
  
  // Mud banks
  ctx.fillStyle = '#8b583f';
  ctx.fillRect(riverStart - 80, riverY + riverHeight - 40, 80, 40);
  ctx.fillRect(riverEnd, riverY + riverHeight - 40, 80, 40);
  
  // Mud texture
  ctx.strokeStyle = '#efb36c';
  ctx.lineWidth = 2;
  ctx.strokeRect(riverStart - 80, riverY + riverHeight - 40, 80, 40);
  ctx.strokeRect(riverEnd, riverY + riverHeight - 40, 80, 40);
}

function drawBridge() {
  const bridgeX = riverStart + (riverEnd - riverStart) / 2;
  const bridgeY = riverY;
  
  // Bridge structure
  ctx.fillStyle = '#5a6f73';
  ctx.fillRect(bridgeX - 40, bridgeY + 100, 80, 60);
  
  // Posts
  ctx.fillStyle = '#8b6f47';
  ctx.fillRect(bridgeX - 60, bridgeY + 80, 15, 80);
  ctx.fillRect(bridgeX + 45, bridgeY + 80, 15, 80);
  
  if (gameState.worldChanges.bridgeBoarded) {
    // Boards
    ctx.fillStyle = '#b8956e';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(bridgeX - 35, bridgeY + 25 + i * 18, 70, 12);
    }
    ctx.strokeStyle = '#7a5c3d';
    ctx.lineWidth = 1;
    ctx.strokeRect(bridgeX - 35, bridgeY + 25, 70, 72);
  } else if (gameState.worldChanges.ropeBridge) {
    // Rope lines
    ctx.strokeStyle = '#d8ba69';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bridgeX - 50, bridgeY + 20);
    ctx.quadraticCurveTo(bridgeX - 50, bridgeY + 60, bridgeX, bridgeY + 100);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bridgeX + 50, bridgeY + 20);
    ctx.quadraticCurveTo(bridgeX + 50, bridgeY + 60, bridgeX, bridgeY + 100);
    ctx.stroke();
  } else {
    // Broken bridge
    ctx.fillStyle = 'rgba(139, 111, 71, .5)';
    ctx.fillRect(bridgeX - 40, bridgeY + 100, 80, 60);
    ctx.strokeStyle = '#d2766f';
    ctx.lineWidth = 2;
    ctx.strokeRect(bridgeX - 40, bridgeY + 100, 80, 60);
  }
}

function drawFallenTree() {
  if (gameState.worldChanges.treeDeployed) {
    // Tree deployed as bridge
    ctx.fillStyle = '#8b6f47';
    ctx.save();
    ctx.translate(fallenTree.x + fallenTree.w/2, fallenTree.y + fallenTree.h/2);
    ctx.rotate(-Math.PI / 6);
    ctx.fillRect(-100, -15, 200, 30);
    ctx.restore();
  } else {
    // Fallen tree on ground
    ctx.fillStyle = '#6b4e35';
    ctx.fillRect(fallenTree.x, fallenTree.y, fallenTree.w, fallenTree.h);
    ctx.fillStyle = '#4c3425';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(fallenTree.x + 40 + i * 40, fallenTree.y - 15, 25, 15);
    }
  }
}

function drawMill() {
  const b = buildings.find(b => b.id === 'mill');
  ctx.fillStyle = '#c99b68';
  ctx.fillRect(b.x, b.y + 20, b.w, b.h - 20);
  ctx.fillStyle = '#8b6f47';
  ctx.beginPath();
  ctx.moveTo(b.x - 15, b.y + 20);
  ctx.lineTo(b.x + b.w/2, b.y - 25);
  ctx.lineTo(b.x + b.w + 15, b.y + 20);
  ctx.closePath();
  ctx.fill();
  
  // Water wheel (spinning if helped)
  const wheelX = b.x + b.w + 50;
  const wheelY = b.y + b.h - 30;
  const rotation = gameState.helped.has('miller') ? (gameState.tick * 0.02) : 0;
  
  ctx.save();
  ctx.translate(wheelX, wheelY);
  ctx.rotate(rotation);
  ctx.strokeStyle = '#8b6f47';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, 35, 0, Math.PI * 2);
  ctx.stroke();
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = '#b8956e';
    ctx.beginPath();
    ctx.arc(Math.cos(i * Math.PI / 4) * 25, Math.sin(i * Math.PI / 4) * 25, 6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawGate() {
  ctx.fillStyle = gate.open ? '#4c3425' : '#8b6f47';
  ctx.fillRect(gate.x, gate.y, gate.w, gate.h);
  if (!gate.open) {
    ctx.fillStyle = '#d2766f';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('LOCKED', gate.x + gate.w/2, gate.y + gate.h/2 + 4);
  }
  ctx.textAlign = 'left';
}

function drawBuilding(b) {
  ctx.fillStyle = b.type === 'tower' ? '#5a6f73' : '#c99b68';
  ctx.fillRect(b.x, b.y + 20, b.w, b.h - 20);
  
  ctx.fillStyle = b.roof || '#9a5f42';
  ctx.beginPath();
  ctx.moveTo(b.x - 12, b.y + 20);
  ctx.lineTo(b.x + b.w/2, b.y - 25);
  ctx.lineTo(b.x + b.w + 12, b.y + 20);
  ctx.closePath();
  ctx.fill();
  
  // Door
  ctx.fillStyle = '#563b2b';
  ctx.fillRect(b.x + b.w/2 - 9, b.y + b.h - 25, 18, 25);
  ctx.fillStyle = '#d8ba69';
  ctx.beginPath();
  ctx.arc(b.x + b.w/2 + 6, b.y + b.h - 17, 2, 0, Math.PI * 2);
  ctx.fill();
  
  // Window
  ctx.fillStyle = '#a8d2dc';
  ctx.fillRect(b.x + 10, b.y + 30, 16, 14);
}

function drawTree(x, y, scale = 1) {
  ctx.fillStyle = '#4c3425';
  ctx.fillRect(x - 3*scale, y, 6*scale, 18*scale);
  ctx.fillStyle = '#496b45';
  ctx.beginPath();
  ctx.arc(x, y - 6*scale, 13*scale, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#5b7d50';
  ctx.beginPath();
  ctx.arc(x - 8*scale, y - 2*scale, 9*scale, 0, Math.PI*2);
  ctx.arc(x + 8*scale, y - 2*scale, 9*scale, 0, Math.PI*2);
  ctx.fill();
}

function drawTrainTrack() {
  ctx.fillStyle = '#5a5a5a';
  ctx.fillRect(trainTrack.x, trainTrack.y, trainTrack.w, 8);
  ctx.fillRect(trainTrack.x, trainTrack.y + 20, trainTrack.w, 8);
  
  ctx.strokeStyle = '#3a3a3a';
  ctx.lineWidth = 2;
  for (let x = trainTrack.x; x < trainTrack.x + trainTrack.w; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x, trainTrack.y + 8);
    ctx.lineTo(x, trainTrack.y + 20);
    ctx.stroke();
  }
}

function drawNpc(npc) {
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath();
  ctx.ellipse(npc.x, npc.y + 12, 10, 3, 0, 0, Math.PI*2);
  ctx.fill();
  
  ctx.fillStyle = '#f0e2bd';
  ctx.beginPath();
  ctx.arc(npc.x, npc.y - 8, 8, 0, Math.PI*2);
  ctx.fill();
  
  ctx.fillStyle = '#4c657f';
  ctx.fillRect(npc.x - 8, npc.y + 2, 16, 18);
  
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(npc.emoji, npc.x, npc.y - 20);
  ctx.font = '9px sans-serif';
  ctx.fillStyle = '#2c241d';
  ctx.fillText(npc.name, npc.x, npc.y + 32);
  ctx.textAlign = 'left';
}

function drawPlayer() {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath();
  ctx.ellipse(player.x, player.y + 12, 10, 3, 0, 0, Math.PI*2);
  ctx.fill();
  
  ctx.fillStyle = '#f0e2bd';
  ctx.beginPath();
  ctx.arc(player.x, player.y - 8, 8, 0, Math.PI*2);
  ctx.fill();
  
  ctx.fillStyle = '#4c657f';
  ctx.fillRect(player.x - 8, player.y + 2, 16, 18);
  
  ctx.fillStyle = '#d9c08a';
  ctx.fillRect(player.x + 6, player.y + 4, 8, 12);
}

function draw() {
  drawBackground();
  drawTrainTrack();
  drawRiver();
  drawMill();
  drawBridge();
  drawFallenTree();
  
  // Buildings
  for (const b of buildings) {
    if (b.id !== 'mill') {
      drawBuilding(b);
    }
  }
  
  drawGate();
  
  // Decorations
  drawTree(80, 180, 0.9);
  drawTree(1100, 200, 1.1);
  drawTree(250, 650, 0.8);
  
  // NPCs
  for (const npc of npcs) {
    drawNpc(npc);
  }
  
  drawPlayer();
  
  // Interaction prompts
  for (const b of buildings) {
    if (Math.hypot(player.x - (b.x + b.w/2), player.y - (b.y + b.h/2)) < 60) {
      ctx.fillStyle = '#d8ba69';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`E: Enter ${b.name}`, b.x + b.w/2, b.y - 40);
    }
  }
}

function loop() {
  gameState.tick++;
  movePlayer();
  draw();
  requestAnimationFrame(loop);
}

// --- INPUT ---
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
    keys[k] = true;
    e.preventDefault();
  }
  if (k === 'e') {
    tryInteract();
    e.preventDefault();
  }
  if (k === 'q' || k === 'escape') {
    if (gameState.indoors) exitBuilding();
    e.preventDefault();
  }
});

addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = false;
});

// Initialize
updateInventory();
updateStatus();
loop();
</script>
</body>
</html>
