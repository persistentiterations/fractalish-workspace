<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Eracii · Full Survival Loop</title>
<style>
  body { margin:0; background:#1a2b18; overflow:hidden; font-family:'Courier New', monospace; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  
  .hud { position:fixed; top:10px; left:10px; background:rgba(8,6,4,0.94); border:2px solid #7a6a4a; padding:14px 18px; border-radius:10px; color:#e6dfc7; font-size:14px; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,0.9); width:380px; z-index:10; }
  .hud .gold { color:#e6c875; font-weight:bold; }
  .hud .red { color:#d97a5a; font-weight:bold; }
  .hud .green { color:#7dbf8a; font-weight:bold; }
  .stat-row { display:flex; gap:16px; flex-wrap:wrap; margin-top:6px; }
  .stat-box { background:rgba(0,0,0,0.3); padding:2px 8px; border-radius:4px; border:1px solid rgba(255,255,255,0.05); }
  
  .journal { position:fixed; top:10px; right:10px; width:320px; background:rgba(8,6,4,0.94); border:2px solid #7a6a4a; border-radius:10px; padding:14px 18px; color:#e6dfc7; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,0.9); max-height:320px; overflow-y:auto; pointer-events:none; z-index:10; }
  .journal b { color:#c9b88a; font-size:11px; text-transform:uppercase; letter-spacing:1px; }
  .journal p { margin:6px 0; padding-left:10px; border-left:3px solid #7dbf8a; }

  .toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:rgba(8,6,4,0.96); border:2px solid #c9b88a; padding:12px 24px; border-radius:30px; color:#f0e6d0; font-size:15px; opacity:0; transition:0.4s ease; pointer-events:none; z-index:30; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(-5px); }

  #buildMenu { position:fixed; bottom:60px; left:50%; transform:translateX(-50%); background:rgba(8,6,4,0.96); border:2px solid #c9b88a; border-radius:14px; padding:24px; color:#e6dfc7; display:none; z-index:20; box-shadow:0 12px 40px rgba(0,0,0,0.95); min-width:320px; text-align:center; }
  #buildMenu.active { display:block; }
  #buildMenu h3 { margin:0 0 14px; color:#e6c875; font-size:18px; }
  .build-btn { background:#2a1f14; border:1px solid #7a6a4a; color:#e6c875; padding:10px 18px; margin:6px; border-radius:8px; cursor:pointer; font-size:14px; transition:0.2s; }
  .build-btn:hover { background:#4a3525; border-color:#c9b88a; transform:scale(1.02); }
  .close-btn { background:#3a2a1a; border:1px solid #d97a5a; color:#d97a5a; padding:8px 14px; margin-top:12px; border-radius:8px; cursor:pointer; font-size:13px; }
</style>
</head>
<body>
<canvas id="world"></canvas>

<div class="hud" id="hud">
  <b>🏡 ERAcii · HOMESTEAD</b>
  <div style="font-size:12px; color:#a09070; margin-top:2px;">Stamina: <span id="staminaBar" style="color:#7dbf8a;">100</span>%</div>
  <div class="stat-row">
    <span class="stat-box">🪓 <span id="wood" class="gold">5</span></span>
    <span class="stat-box">🥩 <span id="meat" class="gold">0</span></span>
    <span class="stat-box">🌱 <span id="seeds" class="green">4</span></span>
    <span class="stat-box">🔩 <span id="scrap" class="gold">0</span></span>
    <span class="stat-box">🔫 <span id="ammo" class="gold">6</span></span>
  </div>
  <div class="stat-row" style="font-size:12px;">
    <span class="stat-box">🏠 <span id="houseLevel">1</span></span>
    <span class="stat-box">🐕 <span id="dogStatus" class="green">Alive</span></span>
  </div>
  <div style="margin-top:6px; font-size:11px; color:#a09070;">Press <b>B</b> Build · <b>E</b> Eat · Click to interact</div>
</div>

<div class="journal" id="journal">
  <b>📜 JOURNAL</b>
  <p>You stepped off the train with a dog, a shotgun, and a pocket full of seeds.</p>
</div>

<div class="toast" id="toast"></div>

<div id="buildMenu">
  <h3>🛠️ Construction</h3>
  <button class="build-btn" onclick="buildFence()">🪵 Fence (10 Wood)</button>
  <button class="build-btn" onclick="buildHouseUpgrade()">🏠 Upgrade House (50 Wood)</button>
  <button class="build-btn" onclick="craftAmmo()">🔩 Craft Ammo (5 Scrap)</button>
  <button class="close-btn" onclick="closeBuildMenu()">Close</button>
</div>

<script>
// ============================================
// CANVAS SETUP
// ============================================
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
const W = 1200, H = 800;
canvas.width = W; canvas.height = H;

// ============================================
// JOURNAL SYSTEM
// ============================================
function addJournal(text) {
  const journal = document.getElementById('journal');
  const entry = document.createElement('p');
  entry.textContent = `• ${text}`;
  journal.appendChild(entry);
  while (journal.children.length > 14) journal.removeChild(journal.children[1]);
}

// ============================================
// WORLD STATE
// ============================================
const world = {
  wood: 5, meat: 0, seeds: 4, scrap: 0, ammo: 6,
  stamina: 100,
  dogActive: true, dogHunger: 80,
  
  // Buildings
  hasFence: false,
  houseLevel: 1, // 1 = Cabin, 2 = House, 3 = Estate
  hasWorkbench: false,
  
  // Environment
  stumps: [], saplings: [], gardens: [],
  fenceBuilt: false,
  
  // Player
  px: 400, py: 500, targetX: 400, targetY: 500,
  isEating: false
};

// ============================================
// ENTITIES
// ============================================
let trees = [], deer = [], wolves = [], rabbits = [];
let dog = { x: 380, y: 480, targetX: 380, targetY: 480, isHunting: false, huntTimer: 0 };

// ============================================
// GENERATE FOREST
// ============================================
function generateWorld() {
  trees = [];
  for (let i=0; i<35; i++) {
    const x = 50 + (i*43) % 1100, y = 50 + (i*61) % 700;
    if (Math.hypot(x-600, y-400) < 150) continue;
    trees.push({ x, y, size:0.6+((i*7)%10)/10, alive:true, wood:2+((i*3)%5) });
  }
  deer = [];
  for (let i=0; i<5; i++) deer.push({ x:100+Math.random()*1000, y:100+Math.random()*600, targetX:0, targetY:0, alive:true });
  wolves = [];
  for (let i=0; i<3; i++) wolves.push({ x:100+Math.random()*1000, y:100+Math.random()*600, targetX:0, targetY:0, alive:true });
  rabbits = [];
  for (let i=0; i<8; i++) rabbits.push({ x:100+Math.random()*1000, y:100+Math.random()*600, targetX:0, targetY:0, alive:true });
}

// ============================================
// BUILD MENU ACTIONS
// ============================================
function toggleBuildMenu() { document.getElementById('buildMenu').classList.toggle('active'); }
function closeBuildMenu() { document.getElementById('buildMenu').classList.remove('active'); }

function buildFence() {
  if (world.wood < 10) return showToast('❌ Need 10 Wood');
  if (world.hasFence) return showToast('✅ Fence already built.');
  world.wood -= 10; world.hasFence = true;
  addJournal("You built a wooden fence. Wolves will respect it.");
  updateHUD(); closeBuildMenu();
}

function buildHouseUpgrade() {
  if (world.wood < 50) return showToast('❌ Need 50 Wood');
  if (world.houseLevel >= 3) return showToast('🏠 It\'s a mansion already!');
  world.wood -= 50; world.houseLevel++;
  if (world.houseLevel === 2) {
    world.hasWorkbench = true;
    addJournal("You expanded the house! The workbench lets you craft ammo from scrap.");
    showToast('🔨 House upgraded! Workbench unlocked.');
  } else if (world.houseLevel === 3) {
    addJournal("You built a second story. The homestead looks magnificent.");
    showToast('🏰 House upgraded to Level 3!');
  }
  updateHUD(); closeBuildMenu();
}

function craftAmmo() {
  if (!world.hasWorkbench) return showToast('❌ Build Workbench (House Lvl 2) first.');
  if (world.scrap < 5) return showToast('❌ Need 5 Scrap Metal (find it by digging stumps).');
  world.scrap -= 5; world.ammo += 3;
  addJournal("Crafted 3 shells from scrap metal.");
  showToast('🔫 +3 Ammo crafted!');
  updateHUD(); closeBuildMenu();
}

// ============================================
// PLAYER MOVEMENT
// ============================================
const keys = {};
function movePlayer() {
  let dx=0, dy=0;
  if (keys['w']||keys['arrowup']) dy-=1; if (keys['s']||keys['arrowdown']) dy+=1;
  if (keys['a']||keys['arrowleft']) dx-=1; if (keys['d']||keys['arrowright']) dx+=1;
  if (dx||dy) {
    const len = Math.hypot(dx,dy); dx/=len; dy/=len;
    world.px += dx*4.5; world.py += dy*4.5;
    world.px = Math.max(20, Math.min(W-20, world.px));
    world.py = Math.max(20, Math.min(H-20, world.py));
  } else {
    const dist = Math.hypot(world.targetX-world.px, world.targetY-world.py);
    if (dist > 3) { world.px += (world.targetX-world.px)/dist*4.5; world.py += (world.targetY-world.py)/dist*4.5; }
  }
}

// ============================================
// DOG AI
// ============================================
function tickDog() {
  if (!world.dogActive) return;
  if (world.dogHunger <= 0) {
    world.dogActive = false;
    addJournal("Rex collapsed from hunger. Feed him meat to revive him.");
    return;
  }
  world.dogHunger -= 0.002; // decays slowly

  // Follow player if not hunting
  if (!dog.isHunting) {
    const d = Math.hypot(world.px - dog.x, world.py - dog.y);
    if (d > 40) { dog.x += (world.px - dog.x)/d * 1.5; dog.y += (world.py - dog.y)/d * 1.5; }
  }

  // Auto-hunt rabbits if dog is fed
  if (world.dogHunger > 30 && Math.random() < 0.003) {
    dog.isHunting = true;
    dog.huntTimer = 100; // roughly 5 seconds
    showToast('🐕 Rex is hunting a rabbit!');
  }
  if (dog.isHunting) {
    dog.huntTimer--;
    // Find a rabbit and chase it
    let target = rabbits.find(r => r.alive);
    if (target) {
      const d = Math.hypot(target.x - dog.x, target.y - dog.y);
      if (d > 20) { dog.x += (target.x - dog.x)/d * 3; dog.y += (target.y - dog.y)/d * 3; }
    }
    if (dog.huntTimer <= 0) {
      dog.isHunting = false;
      if (Math.random() < 0.5) {
        // Success!
        world.meat += 2;
        world.dogHunger = Math.min(100, world.dogHunger + 20);
        addJournal("Rex caught a rabbit! +2 Meat.");
        showToast('🐕 Rex caught a rabbit!');
      } else {
        showToast('🐕 Rex missed the rabbit.');
      }
    }
  }
}

// ============================================
// WORLD TICK
// ============================================
function tickWorld() {
  // Stamina decays slowly if starving
  if (world.stamina < 100 && world.stamina > 0) world.stamina += 0.02;
  if (world.stamina <= 0) showToast('⚠️ You are exhausted. Eat meat!');

  // Saplings grow into trees
  for (let i=world.saplings.length-1; i>=0; i--) {
    world.saplings[i].age += 0.08;
    if (world.saplings[i].age >= 70) {
      trees.push({ x:world.saplings[i].x, y:world.saplings[i].y, size:0.8, alive:true, wood:3 });
      world.saplings.splice(i,1);
      addJournal("A sapling grew into a mature tree.");
    }
  }

  // Wolves attack if no fence
  if (!world.hasFence && world.shedHealth > 0 && wolves.some(w=>w.alive) && !world.dogActive && Math.random()<0.002) {
    world.shedHealth -= 5;
    showToast('🐺 Wolves attacked the shed! -5 HP');
  }

  // Deer movement
  deer.forEach(d => {
    if (!d.alive) return;
    if (Math.hypot(world.px-d.x, world.py-d.y) < 150) {
      d.targetX = world.px + (d.x-world.px)*2 + Math.random()*100;
      d.targetY = world.py + (d.y-world.py)*2 + Math.random()*100;
    } else if (Math.random()<0.02 || d.targetX===0) {
      d.targetX = 50+Math.random()*1100; d.targetY = 50+Math.random()*700;
    }
    const dist = Math.hypot(d.targetX-d.x, d.targetY-d.y);
    if (dist>2) { d.x += (d.targetX-d.x)/dist*1.5; d.y += (d.targetY-d.y)/dist*1.5; }
  });

  // Wolf movement
  wolves.forEach(w => {
    if (!w.alive) return;
    let nearest=null, nearDist=999;
    deer.forEach(d => { if(d.alive) { const dist=Math.hypot(w.x-d.x,w.y-d.y); if(dist<nearDist){nearDist=dist;nearest=d;} } });
    if (nearest && nearDist<300) { w.targetX=nearest.x; w.targetY=nearest.y; }
    else if (Math.random()<0.01) { w.targetX=50+Math.random()*1100; w.targetY=50+Math.random()*700; }
    const dist = Math.hypot(w.targetX-w.x, w.targetY-w.y);
    if (dist>2) { w.x += (w.targetX-w.x)/dist*2.2; w.y += (w.targetY-w.y)/dist*2.2; }
  });

  // Rabbits hop
  rabbits.forEach(r => {
    if (!r.alive) return;
    if (Math.random()<0.02) { r.targetX = 50+Math.random()*1100; r.targetY = 50+Math.random()*700; }
    const dist = Math.hypot(r.targetX-r.x, r.targetY-r.y);
    if (dist>2) { r.x += (r.targetX-r.x)/dist*0.8; r.y += (r.targetY-r.y)/dist*0.8; }
  });

  updateHUD();
}

// ============================================
// INTERACTION ENGINE
// ============================================
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width/rect.width; const scaleY = canvas.height/rect.height;
  const mx = (e.clientX-rect.left)*scaleX; const my = (e.clientY-rect.top)*scaleY;

  // 1. PET DOG
  if (world.dogActive && Math.hypot(mx-dog.x, my-dog.y) < 30) {
    world.stamina = Math.min(100, world.stamina + 10);
    world.dogHunger = Math.min(100, world.dogHunger + 5);
    showToast('🐕 You pet Rex. Stamina +10, Dog fed +5.');
    addJournal("You gave Rex some love. He wags his tail.");
    return;
  }

  // 2. CHOP TREE
  for (const t of trees) {
    if (!t.alive) continue;
    if (Math.hypot(mx-t.x, my-t.y) < 40) {
      t.alive = false; world.wood += t.wood; world.stamina -= 3;
      world.stumps.push({x:t.x, y:t.y});
      showToast(`🪓 +${t.wood} Wood. Stamina -3.`);
      updateHUD();
      return;
    }
  }

  // 3. DIG STUMP (Recover Scrap Metal)
  for (let i=world.stumps.length-1; i>=0; i--) {
    const s = world.stumps[i];
    if (Math.hypot(mx-s.x, my-s.y) < 30) {
      world.stumps.splice(i,1);
      const found = Math.random() < 0.4 ? 2 : 1;
      world.scrap += found;
      showToast(`🔧 Dug out stump! Found ${found} Scrap Metal.`);
      updateHUD();
      return;
    }
  }

  // 4. PLANT SEEDS (on empty ground)
  if (world.seeds > 0 && Math.hypot(mx-world.px, my-world.py) < 50) {
    world.seeds--; world.saplings.push({x:mx, y:my, age:0});
    showToast('🌱 Planted a seed. It will grow into a tree.');
    addJournal("Planted a tree seed. The forest will return.");
    updateHUD();
    return;
  }

  // 5. HUNT DEER (uses ammo)
  for (const d of deer) {
    if (!d.alive) continue;
    if (Math.hypot(mx-d.x, my-d.y) < 40) {
      if (world.ammo <= 0) return showToast('❌ No ammo! Craft more at the workbench.');
      world.ammo--; d.alive = false; world.meat += 4;
      showToast(`🔫 +4 Meat. Ammo left: ${world.ammo}`);
      addJournal("Shot a deer. Meat for the table.");
      updateHUD();
      return;
    }
  }

  // 6. KILL WOLF (uses ammo)
  for (const w of wolves) {
    if (!w.alive) continue;
    if (Math.hypot(mx-w.x, my-w.y) < 40) {
      if (world.ammo <= 0) return showToast('❌ No ammo!');
      world.ammo--; w.alive = false;
      world.scrap += 3; // Wolves drop scrap
      showToast(`🔫 Wolf killed. +3 Scrap.`);
      updateHUD();
      return;
    }
  }

  // 7. HUNT RABBIT (uses ammo)
  for (const r of rabbits) {
    if (!r.alive) continue;
    if (Math.hypot(mx-r.x, my-r.y) < 30) {
      if (world.ammo <= 0) return showToast('❌ No ammo!');
      world.ammo--; r.alive = false; world.meat += 1;
      showToast(`🔫 +1 Rabbit Meat.`);
      updateHUD();
      return;
    }
  }

  // Walk to click
  world.targetX = mx; world.targetY = my;
});

// ============================================
// EAT FUNCTION (Press E)
// ============================================
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'b') toggleBuildMenu();
  if (k === 'e') {
    if (world.meat <= 0) return showToast('❌ No meat to eat!');
    world.meat--;
    world.stamina = Math.min(100, world.stamina + 25);
    showToast('🍖 Ate a piece of meat. Stamina +25.');
    updateHUD();
  }
});
addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); keys[k] = false; });

// ============================================
// HUD UPDATE
// ============================================
function updateHUD() {
  document.getElementById('wood').textContent = world.wood;
  document.getElementById('meat').textContent = world.meat;
  document.getElementById('seeds').textContent = world.seeds;
  document.getElementById('scrap').textContent = world.scrap;
  document.getElementById('ammo').textContent = world.ammo;
  document.getElementById('staminaBar').textContent = Math.floor(world.stamina);
  document.getElementById('houseLevel').textContent = world.houseLevel;
  document.getElementById('dogStatus').textContent = world.dogActive ? '🐕 Healthy' : '💤 Starving';
  document.getElementById('dogStatus').style.color = world.dogActive ? '#7dbf8a' : '#d97a5a';
}

// ============================================
// RENDERING ENGINE
// ============================================
function render() {
  ctx.clearRect(0,0,W,H);
  
  // Ground
  ctx.fillStyle = '#3d5937';
  ctx.fillRect(0,0,W,H);
  
  // Grass texture
  ctx.fillStyle = '#4a6a42';
  for (let i=0; i<80; i++) {
    const gx = (i*71)%W, gy = (i*43)%H;
    if (gy < 300 || gy > 400) { ctx.fillRect(gx, gy, 2, 4); }
  }

  // Stumps
  world.stumps.forEach(s => {
    ctx.fillStyle = '#4a3525'; ctx.fillRect(s.x-6, s.y-4, 12, 8);
    ctx.fillStyle = '#3d281d'; ctx.fillRect(s.x-4, s.y-6, 8, 4);
  });

  // Saplings
  world.saplings.forEach(s => {
    const h = 4 + (s.age/70)*16;
    ctx.fillStyle = '#2d5a2d'; ctx.fillRect(s.x-1, s.y-h, 2, h);
    ctx.fillStyle = '#4a7a4a'; ctx.beginPath(); ctx.arc(s.x, s.y-h, 2+(s.age/70)*5, 0, Math.PI*2); ctx.fill();
  });

  // Trees
  trees.forEach(t => {
    if (!t.alive) return;
    ctx.fillStyle = '#4d3a28'; ctx.fillRect(t.x-3*t.size, t.y, 6*t.size, 16*t.size);
    ctx.fillStyle = '#2d5a2d'; ctx.beginPath(); ctx.arc(t.x, t.y-8*t.size, 16*t.size, 0, Math.PI*2); ctx.fill();
  });

  // Rabbits
  rabbits.forEach(r => { if (r.alive) { ctx.font='22px sans-serif'; ctx.textAlign='center'; ctx.fillText('🐇', r.x, r.y); } });

  // Deer
  deer.forEach(d => { if (d.alive) { ctx.font='28px sans-serif'; ctx.fillText('🦌', d.x, d.y); } });
  
  // Wolves
  wolves.forEach(w => { if (w.alive) ctx.fillText('🐺', w.x, w.y); });
  ctx.textAlign = 'left';

  // Dog
  if (world.dogActive) {
    ctx.font='24px sans-serif'; ctx.textAlign='center';
    ctx.fillText('🐕', dog.x, dog.y);
    if (dog.isHunting) { ctx.fillStyle='#e6c875'; ctx.font='14px'; ctx.fillText('🏹 HUNTING', dog.x, dog.y-20); }
  }

  // Fence
  if (world.hasFence) {
    ctx.fillStyle = '#6b4f31';
    ctx.fillRect(75, 380, 160, 4); ctx.fillRect(75, 440, 160, 4);
    ctx.fillRect(75, 380, 4, 60); ctx.fillRect(230, 380, 4, 60);
    ctx.fillRect(145, 380, 4, 60);
  }

  // Shed & House
  ctx.fillStyle = '#5a4030'; ctx.fillRect(100,400,100,80);
  ctx.fillStyle = '#8b6f47'; ctx.fillRect(100,400,100,80);
  ctx.fillStyle = '#4a3020'; ctx.fillRect(140,450,20,30);

  // House Levels (Visual growth)
  if (world.houseLevel >= 2) {
    ctx.fillStyle = '#8b6f47'; ctx.fillRect(230, 340, 80, 80);
    ctx.fillStyle = '#5a4030'; ctx.beginPath(); ctx.moveTo(220, 340); ctx.lineTo(270, 300); ctx.lineTo(320, 340); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e6c875'; ctx.fillRect(260, 380, 20, 40);
    if (world.houseLevel >= 3) {
      ctx.fillStyle = '#8b6f47'; ctx.fillRect(230, 280, 80, 60);
      ctx.fillStyle = '#e6c875'; ctx.fillRect(250, 300, 10, 10); ctx.fillRect(280, 300, 10, 10);
    }
  }

  // Player
  ctx.fillStyle = '#f4d7b9'; ctx.fillRect(world.px-6, world.py-14, 12, 12);
  ctx.fillStyle = '#3b6ea5'; ctx.fillRect(world.px-6, world.py-2, 12, 14);
  ctx.fillStyle = '#4a2e1b'; ctx.fillRect(world.px-4, world.py-16, 8, 6);
}

// ============================================
// TOAST
// ============================================
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ============================================
// MAIN LOOP
// ============================================
generateWorld();
addJournal("You have 4 seeds, 6 bullets, and a loyal dog named Rex.");
addJournal("Press 'E' to eat. Press 'B' to build. Hunt wisely.");

function loop() {
  tickDog();
  movePlayer();
  tickWorld();
  render();
  requestAnimationFrame(loop);
}
